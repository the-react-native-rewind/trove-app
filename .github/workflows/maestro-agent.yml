name: Maestro Agent

on: pull_request

permissions:
  contents: write        # push the generated flow back to the PR branch
  pull-requests: write

concurrency:
  group: maestro-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the PR's source branch (not the detached merge ref) so the
          # commit-back step can push the generated flow to it. NOTE: fork PRs get
          # a read-only token and no secrets, so this pipeline is same-repo only.
          ref: ${{ github.head_ref }}

      # ubuntu-latest ships with ~14 GB free on /, which the RN build fills —
      # leaving too little for the emulator's AVD ("not enough disk space to
      # run avd"). Reclaim ~15-25 GB of preinstalled toolchains we don't use.
      # Does NOT touch the Android SDK/NDK or Node — those are needed downstream.
      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Expo prebuild (android)
        run: npx expo prebuild -p android --no-install

      - name: Gather PR context
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          {
            echo "# Title"
            echo "$TITLE"
            echo
            echo "# Description"
            echo "$BODY"
          } > pr-context.md
          # We checked out the PR branch (head_ref), so diff against the fetched
          # base branch — three-dot = only what this PR changed.
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/${BASE_REF}...HEAD" > pr-diff.patch
          # One stable flow file per feature branch: the same branch always maps to
          # the same file, so re-runs UPDATE it in place while distinct features
          # accumulate into the suite that Maestro Cloud runs on main.
          SLUG=$(printf '%s' "$HEAD_REF" | sed 's#.*/##; s/[^A-Za-z0-9._-]/-/g')
          echo ".maestro/${SLUG}.yaml" > flow-target.txt
          echo "Flow target: $(cat flow-target.txt)"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # One source-hash key, computed once and reused by restore + save so they
      # can't drift. The release APK embeds the JS bundle AND the EXPO_PUBLIC_*
      # values Metro inlines at build time, so the key must cover ALL app source
      # (src, assets), deps, native config, AND those env values — otherwise a
      # stale APK (e.g. one built without Supabase config, which crashes on
      # launch) would be restored and tested silently. Workflow-only edits (this
      # YAML) still hit the cache, so iterating on the pipeline skips the build.
      # (These EXPO_PUBLIC_* values are public by design — the anon key ships in
      # every client binary — so a truncated hash of them in the key leaks nothing.)
      - name: Compute APK cache key
        id: apk-key
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          ENV_HASH=$(printf '%s' "${EXPO_PUBLIC_SUPABASE_URL}|${EXPO_PUBLIC_SUPABASE_ANON_KEY}" | sha256sum | cut -c1-12)
          SRC_HASH=${{ hashFiles('package-lock.json', 'app.json', 'babel.config.js', 'tsconfig.json', 'src/**', 'assets/**') }}
          echo "key=apk-release-x86_64-${ENV_HASH}-${SRC_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore cached release APK
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.apk-key.outputs.key }}

      # Build the APK before booting the emulator so the AVD isn't holding
      # 2-4 GB of RAM while the C++ (reanimated/worklets/skia) compiles, and
      # only for x86_64 (the sole ABI this emulator runs) instead of the
      # default 4 ABIs — ~75% less native work. Skipped entirely on a cache hit.
      - name: Build release APK (x86_64)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: android
        env:
          # EXPO_PUBLIC_* are inlined into the JS bundle by Metro DURING this
          # release build, so they must be present here (not at emulator runtime).
          # Without them the app crashes on launch: "Missing Supabase config".
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64

      # Save right after building, BEFORE the emulator step (the one that tends
      # to fail). actions/cache's implicit save only runs on full-job success, so
      # an explicit save here caches the APK even when a later step fails —
      # exactly the debugging case we want to stay fast.
      - name: Save release APK to cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.apk-key.outputs.key }}

      - name: Generate test, run
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Bills the agent against a Claude Pro/Max subscription instead of
          # Console API credits (separate billing surface). Generate locally with
          # `claude setup-token` and store as the CLAUDE_CODE_OAUTH_TOKEN secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Test-user login for the agent to get past the auth screen. Kept in
          # secrets (never hardcoded) because this repo is PUBLIC — a literal
          # password would leak via the committed workflow AND the flow YAML that
          # the "Comment on PR" step posts publicly. The generated flow references
          # these as ${MAESTRO_TEST_EMAIL}/${MAESTRO_TEST_PASSWORD} placeholders
          # and maestro test injects the real values via -e at runtime.
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # NOTE: android-emulator-runner executes this script ONE LINE AT A TIME
          # (each line is a separate `sh -c`), so a command must NOT be split
          # across lines with `\` — the continuation lines run as their own
          # commands and fail. Keep the `claude` invocation on a single line.
          # The action already fails the job if any line exits non-zero.
          script: |
            mkdir -p .maestro maestro-results
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            printf 'email: %s\npassword: %s\n' "$MAESTRO_TEST_EMAIL" "$MAESTRO_TEST_PASSWORD" > pr-credentials.md
            claude -p "$(cat .github/maestro-agent-prompt.md)" --mcp-config .github/mcp.json --allowedTools "mcp__maestro__list_devices,mcp__maestro__inspect_screen,mcp__maestro__take_screenshot,mcp__maestro__run,mcp__maestro__cheat_sheet,Write,Read" --dangerously-skip-permissions --max-turns 40 < /dev/null | tee agent-output.txt
            maestro test .maestro --format junit --output maestro-results/report.xml -e MAESTRO_TEST_EMAIL="$MAESTRO_TEST_EMAIL" -e MAESTRO_TEST_PASSWORD="$MAESTRO_TEST_PASSWORD" 2>&1 | tee maestro-results/run.log || true

      # Persist the agent's validated flow onto the PR branch so it becomes part
      # of the committed suite. [skip ci] stops this push from re-triggering the
      # workflow (which would loop). Only commits a flow that was actually
      # produced; the agent already validated it live via its Maestro run loop.
      - name: Commit generated flow to the PR
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          TARGET=$(cat flow-target.txt 2>/dev/null || true)
          if [ -z "$TARGET" ] || [ ! -s "$TARGET" ]; then
            echo "No flow produced at '$TARGET'; nothing to commit."; exit 0
          fi
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "Flow unchanged; nothing to commit."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(maestro): add/update generated flow for this PR [skip ci]"
          git push origin "HEAD:${HEAD_REF}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-artifacts
          path: |
            .maestro/
            maestro-results/
            agent-output.txt

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '(missing)';
            const target = (read('flow-target.txt') || '.maestro/generated.yaml').trim();
            const yaml = read(target);
            const log = read('maestro-results/run.log').slice(-3000);
            const body = [
              '## Maestro Agent',
              '',
              '**Generated flow** `' + target + '`:',
              '```yaml',
              yaml,
              '```',
              '',
              '<details><summary>maestro test output</summary>',
              '',
              '```',
              log,
              '```',
              '</details>',
              '',
              'Artifacts (flow + screenshots) are attached to the workflow run.',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
