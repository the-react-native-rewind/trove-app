name: Maestro Agent

on: pull_request

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: maestro-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ubuntu-latest ships with ~14 GB free on /, which the RN build fills —
      # leaving too little for the emulator's AVD ("not enough disk space to
      # run avd"). Reclaim ~15-25 GB of preinstalled toolchains we don't use.
      # Does NOT touch the Android SDK/NDK or Node — those are needed downstream.
      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Expo prebuild (android)
        run: npx expo prebuild -p android --no-install

      - name: Gather PR context
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "# Title"
            echo "$TITLE"
            echo
            echo "# Description"
            echo "$BODY"
          } > pr-context.md
          git diff "$BASE".."$HEAD" > pr-diff.patch

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # One source-hash key, computed once and reused by restore + save so they
      # can't drift. The release APK embeds the JS bundle, so the key must cover
      # ALL app source (src, assets) plus deps and native config — otherwise a
      # stale APK would be tested silently. Workflow-only edits (this YAML)
      # intentionally hit the cache, so iterating on the pipeline skips the build.
      - name: Compute APK cache key
        id: apk-key
        run: echo "key=apk-release-x86_64-${{ hashFiles('package-lock.json', 'app.json', 'babel.config.js', 'tsconfig.json', 'src/**', 'assets/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached release APK
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.apk-key.outputs.key }}

      # Build the APK before booting the emulator so the AVD isn't holding
      # 2-4 GB of RAM while the C++ (reanimated/worklets/skia) compiles, and
      # only for x86_64 (the sole ABI this emulator runs) instead of the
      # default 4 ABIs — ~75% less native work. Skipped entirely on a cache hit.
      - name: Build release APK (x86_64)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64

      # Save right after building, BEFORE the emulator step (the one that tends
      # to fail). actions/cache's implicit save only runs on full-job success, so
      # an explicit save here caches the APK even when a later step fails —
      # exactly the debugging case we want to stay fast.
      - name: Save release APK to cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.apk-key.outputs.key }}

      - name: Generate test, run
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Bills the agent against a Claude Pro/Max subscription instead of
          # Console API credits (separate billing surface). Generate locally with
          # `claude setup-token` and store as the CLAUDE_CODE_OAUTH_TOKEN secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            set -e
            mkdir -p .maestro maestro-results
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            claude -p "$(cat .github/maestro-agent-prompt.md)" \
              --mcp-config .github/mcp.json \
              --allowedTools "mcp__maestro__list_devices,mcp__maestro__inspect_screen,mcp__maestro__take_screenshot,mcp__maestro__run,mcp__maestro__cheat_sheet,Write,Read" \
              --dangerously-skip-permissions \
              --max-turns 40 | tee agent-output.txt
            maestro test .maestro --format junit --output maestro-results/report.xml 2>&1 | tee maestro-results/run.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-artifacts
          path: |
            .maestro/
            maestro-results/
            agent-output.txt

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '(missing)';
            const yaml = read('.maestro/generated.yaml');
            const log = read('maestro-results/run.log').slice(-3000);
            const body = [
              '## Maestro Agent',
              '',
              '**Generated flow** `.maestro/generated.yaml`:',
              '```yaml',
              yaml,
              '```',
              '',
              '<details><summary>maestro test output</summary>',
              '',
              '```',
              log,
              '```',
              '</details>',
              '',
              'Artifacts (flow + screenshots) are attached to the workflow run.',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
